<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>grid</title>
</head>
<style>
    .grid-container {
        display: grid;

        /* 显式定义 3 列 */
        grid-template-columns: 200px 1fr 150px;

        /* 显式定义 3 行 */
        grid-template-rows: 80px 1fr 60px;

        /* 区域命名 */
        grid-template-areas:
             "header  header  header"
             "sidebar main    aside"
             "footer  footer  footer";

        /* 隐式行/列的备用尺寸 */
        grid-auto-rows: minmax(50px, auto);
        grid-auto-columns: 100px;

        /* 控制自动放置 */
        grid-auto-flow: row dense;

        gap: 10px;
        height: 500px;
    }

    .item {
        background: #4a90d9;
        color: white;
        padding: 16px;
        border-radius: 8px;
    }

    /* 基础效果 */
    .example1 {
        display: grid;
        grid-template-rows: 100px 100px 100px;
        grid-template-columns: 100px 100px 100px;
        width: 500px;
        height: 500px;
        border: 1px solid black;
    }
    .example1>div {
        border: 1px solid black;
        width: 50px;
        height: 50px;
    }

    /* 使用 area */
    .example2 {
        display: grid;
        grid-template-rows: 100px 100px 100px;
        grid-template-columns: 100px 100px 100px;
        grid-template-areas:
                "b b b"
                "c c c"
                "a a a";
        width: 500px;
        height: 500px;
        border: 1px solid black;
    }
    .example2>div {
        border: 1px solid black;
        width: 50px;
        height: 50px;
    }
</style>
<body>
<div class="example1">
    <div>a</div>
    <div>a</div>
    <div>a</div>
    <div>b</div>
    <div>b</div>
    <div>b</div>
    <div>c</div>
    <div>c</div>
    <div>c</div>
</div>

<div class="example2">
    <div style="grid-area: a;">a</div>
    <div style="grid-area: b;">b</div>
    <div style="grid-area: c;">c</div>
</div>

<div class="grid-container">
    <div class="item" style="grid-area: header">Header</div>
    <div class="item" style="grid-area: sidebar">Sidebar</div>
    <div class="item" style="grid-area: main">Main Content</div>
    <div class="item" style="grid-area: aside">Aside</div>
    <div class="item" style="grid-area: footer">Footer</div>
</div>

</body>
</html>
