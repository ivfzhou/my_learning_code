<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>flex</title>
</head>
<style>
    /* flex-direction */
    .example1 {
        width: 500px;
        height: 500px;
        display: flex;
        border-width: 1px;
        border-color: black;
        border-style: solid;
        flex-direction: column;
    }

    .example1 > div {
        width: 50px;
        height: 50px;
        border-width: 1px;
        border-color: black;
        border-style: solid;
    }

    /* flex-wrap */
    .example2 {
        width: 500px;
        height: 500px;
        display: flex;
        border-width: 1px;
        border-color: black;
        border-style: solid;
        flex-wrap: wrap;
    }

    .example2 > div {
        width: 50px;
        height: 50px;
        border-width: 1px;
        border-color: black;
        border-style: solid;
    }

    /* order */
    .example3 {
        width: 500px;
        height: 500px;
        display: flex;
        border-width: 1px;
        border-color: black;
        border-style: solid;
    }

    .example3 > div {
        width: 50px;
        height: 50px;
        border-width: 1px;
        border-color: black;
        border-style: solid;
    }

    /* flex-grow */
    .example4 {
        width: 500px;
        height: 500px;
        display: flex;
        border-width: 1px;
        border-color: black;
        border-style: solid;
    }

    .example4 > div {
        width: 50px;
        height: 50px;
        border-width: 1px;
        border-color: black;
        border-style: solid;
    }

    /* flex-shink */
    .example5 {
        width: 500px;
        height: 500px;
        display: flex;
        border-width: 1px;
        border-color: black;
        border-style: solid;
    }

    .example5 > div {
        width: 50px;
        height: 50px;
        border-width: 1px;
        border-color: black;
        border-style: solid;
    }

    /* flex-basis */
    .example6 {
        width: 500px;
        height: 500px;
        display: flex;
        border-width: 1px;
        border-color: black;
        border-style: solid;
    }

    .example6 > div {
        width: 50px;
        height: 50px;
        border-width: 1px;
        border-color: black;
        border-style: solid;
    }

    /* justify-content */
    .example7 {
        width: 500px;
        height: 500px;
        display: flex;
        border-width: 1px;
        border-color: black;
        border-style: solid;
        justify-content: center;
    }

    .example7 > div {
        width: 50px;
        height: 50px;
        border-width: 1px;
        border-color: black;
        border-style: solid;
    }

    /* align-content */
    .example8 {
        width: 500px;
        height: 500px;
        display: flex;
        border-width: 1px;
        border-color: black;
        border-style: solid;
        flex-wrap: wrap;
        align-content: center;
    }

    .example8 > div {
        width: 50px;
        height: 50px;
        border-width: 1px;
        border-color: black;
        border-style: solid;
    }

    /* align-items */
    .example9 {
        width: 500px;
        height: 500px;
        display: flex;
        border-width: 1px;
        border-color: black;
        border-style: solid;
        align-items: center;
    }

    .example9 > div {
        width: 50px;
        height: 50px;
        border-width: 1px;
        border-color: black;
        border-style: solid;
    }

    /* align-self */
    .example10 {
        width: 500px;
        height: 500px;
        display: flex;
        border-width: 1px;
        border-color: black;
        border-style: solid;
    }

    .example10 > div {
        width: 50px;
        height: 50px;
        border-width: 1px;
        border-color: black;
        border-style: solid;
    }
</style>
<body>

<h1>flex-direction</h1>
<div class="example1">
    <div>a</div>
    <div>b</div>
    <div>c</div>
</div>

<h1>flex-wrap</h1>
<div class="example2">
    <div>a</div>
    <div>b</div>
    <div>c</div>
    <div>d</div>
    <div>e</div>
    <div>f</div>
    <div>g</div>
    <div>h</div>
    <div>i</div>
    <div>j</div>
    <div>k</div>
</div>

<h1>order</h1>
<div class="example3">
    <div style="order: 50">a</div>
    <div>b</div>
    <div>c</div>
    <div>d</div>
    <div>e</div>
    <div>f</div>
    <div>g</div>
    <div>h</div>
</div>

<h1>flex-grow</h1>
<div class="example4">
    <div style="flex-grow: 2">a</div>
    <div style="flex-grow: 1">b</div>
    <div>c</div>
</div>

<h1>flex-shink</h1>
<div class="example5">
    <div style="flex-shrink: 2">a</div>
    <div style="flex-shrink: 0; width: 400px">b</div>
    <div style="flex-shrink: 1">c</div>
</div>

<h1>flex-basis</h1>
<div class="example6">
    <div style="flex-basis: 100px">a</div>
    <div>b</div>
    <div>c</div>
</div>

<h1>justify-content</h1>
<div class="example7">
    <div>a</div>
    <div>b</div>
    <div>c</div>
</div>

<h1>align-content</h1>
<div class="example8">
    <div>a</div>
    <div>b</div>
    <div>c</div>
    <div>d</div>
    <div>e</div>
    <div>f</div>
    <div>g</div>
    <div>h</div>
    <div>i</div>
    <div>g</div>
    <div>k</div>
</div>

<h1>align-items</h1>
<div class="example9">
    <div>a</div>
    <div>b</div>
    <div>c</div>
</div>

<h1>align-self</h1>
<div class="example10">
    <div style="align-self: center">a</div>
    <div>b</div>
    <div>c</div>
</div>

</body>
</html>
