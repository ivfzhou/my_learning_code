<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>margin</title>
    <style>
        /* 右对齐效果 */
        .example1 {
            border: 1px solid black;
            width: 500px;
            height: 500px;
        }
        .example1>div {
            border: 1px solid black;
            width: 50px;
            height: 50px;
            margin-left: auto;
        }
    </style>
</head>
<body>
<div class="example1">
    <div>a</div>
</div>
</body>
</html>
