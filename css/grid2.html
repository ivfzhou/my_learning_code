<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>grid 2</title>
</head>
<style>
    .dashboard {
        display: grid;

        /* 定义 4 列等宽 */
        grid-template-columns: repeat(4, 1fr);
        /* 定义显式行 */
        grid-template-rows: auto 200px 150px;

        /* 间距 */
        gap: 16px 12px;

        /* 所有项目默认顶部左对齐 */
        justify-items: start;
        align-items: start;

        padding: 20px;
        background: #f5f5f5;
    }

    /* 区域命名 + 放置 */
    .header {
        grid-area: 1 / 1 / 2 / -1; /* 第1行，横跨所有列 */
        background: #2563eb;
        color: white;
        text-align: center;
        padding: 16px;
        border-radius: 8px;
    }

    .sidebar {
        grid-column: 1 / 2; /* 第1列 */
        grid-row: 2 / 4; /* 跨越第2-3行 */
        background: #7c3aed;
        color: white;
        border-radius: 8px;
        padding: 16px;
    }

    .main-content {
        grid-column: 2 / 4; /* 第2-3列 */
        grid-row: 2 / 3; /* 仅第2行 */
        background: #059669;
        color: white;
        border-radius: 8px;
        padding: 16px;
    }

    .widget-1 {
        grid-column: 4 / 5; /* 第4列 */
        grid-row: 2 / 3; /* 第2行 */
        background: #dc2626;
        color: white;
        border-radius: 8px;
        padding: 16px;
        justify-self: center; /* 单独居中！覆盖默认 start */
    }

    .widget-2 {
        grid-column: 2 / 5; /* 第2-4列（横跨3列） */
        grid-row: 3 / 4; /* 第3行 */
        background: #ea580c;
        color: white;
        border-radius: 8px;
        padding: 16px;
        justify-self: stretch; /* 拉伸填满 */
    }
</style>
<body>
<div class="dashboard">
    <div class="header">📊 Dashboard Header（横跨全部列）</div>
    <div class="sidebar">📁 Sidebar<br>（跨2行）</div>
    <div class="main-content">📋 Main Content<br>（占据中间2列）</div>
    <div class="widget-1">🔔 Widget 1<br>（justify-self:center 单独居中）</div>
    <div class="widget-2">📈 Widget 2（横跨底部3列，stretch拉伸）</div>
</div>
</body>
</html>
