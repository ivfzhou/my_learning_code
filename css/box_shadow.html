<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>box shadow</title>
    <style>
        #root {
            width: 200px;
            height: 200px;
            border: 2px solid black;
        }

        .box {
            width: 50px;
            height: 50px;
            border: 2px solid black;
            margin: 20px auto auto;
            box-shadow: 10px 10px;
        }
    </style>
</head>
<body>
<div id="root">
    <div class="box">abc</div>
</div>
</body>
</html>
