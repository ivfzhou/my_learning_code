<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>format</title>
</head>
<body>

<abbr>abbr 缩写词</abbr>

<address>address 联系地址</address>

<b>b 粗体问题</b>

<bdi>bdi 文本方向</bdi>

<bdo dir="rtl">bdo 文字方向</bdo>

<blockquote cite="www.qq.com">blockquote 引用</blockquote>

<cite>cite 标题</cite>

<code>code 代码</code>

<del cite="www.qq.com" datetime="2026-04-02T16:56:18+08:00">del 删除文本</del>

<dfn title="value">dfn 定义术语</dfn>

<em>em 强调</em>

<i>i 文本</i>

<ins cite="www.qq.com" datetime="2026-04-02T16:56:18+08:00">ins 文本</ins>

<kbd>kbd 键盘文本</kbd>

<mark>mark 突出文本</mark>

<meter form="formId" high="90" low="10" max="100" min="0" optimum="80" value="70">meter 仪表</meter>

<pre>pre 保留空格换行</pre>

<progress value="50" max="100">progress 进度条</progress>

<q cite="www.qq.com">q 短引用</q>

<rp>rp</rp>

<rt>rt</rt>

<rudy>rudy</rudy>

<s>s</s>

<samp>smap</samp>

<small>small 小号文本</small>

<strong>strong 加粗文本</strong>

<sup>sup 上标文本</sup>

<sub>sub 下标文本</sub>

<template>template 隐藏内容</template>

<time datetime="2026-04">time</time>

<u>u</u>

</html>
