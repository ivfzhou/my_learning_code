<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>form</title>
</head>
<body>

<form accept-charset="UTF-8" action="http://localhost:8080/api/submit" autocomplete="on"
      enctype="application/x-www-form-urlencoded" method="post" name="formName" novalidate="novalidate" rel="external"
      target="_self">

    <input type="file" accept="text/css"/>

    <input type="image" alt="text"/>

    <input autofocus="autofocus"/>

    <input type="checkbox" checked="checked"/>

    <input name="key" dirname="key.dir"/>

    <button>submit</button>
</form>


</body>
</html>
