<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentScope AG-UI Demo</title>
    <style>
        :root {
            --bg-primary: #1a1b26;
            --bg-secondary: #24283b;
            --bg-tertiary: #414868;
            --text-primary: #c0caf5;
            --text-secondary: #9aa5ce;
            --accent-blue: #7aa2f7;
            --accent-green: #9ece6a;
            --accent-orange: #ff9e64;
            --accent-red: #f7768e;
            --accent-cyan: #00BCD4;
            --border-color: #414868;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: var(--text-secondary);
            margin-top: 8px;
            font-size: 0.9rem;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
        }

        .status-dot.disconnected {
            background: var(--accent-red);
        }

        #messages {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            min-height: 400px;
            max-height: 60vh;
        }

        .message {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: var(--bg-tertiary);
            margin-left: 40px;
        }

        .message.assistant {
            background: linear-gradient(135deg, rgba(122, 162, 247, 0.1), rgba(158, 206, 106, 0.1));
            border-left: 3px solid var(--accent-blue);
            margin-right: 40px;
        }

        .message.tool {
            background: rgba(255, 158, 100, 0.1);
            border-left: 3px solid var(--accent-orange);
            margin: 0 60px 16px 60px;
            font-size: 0.85rem;
        }

        .message.reasoning {
            background: rgba(158, 206, 106, 0.08);
            border-left: 3px solid var(--accent-green);
            margin: 0 60px 16px 60px;
            font-size: 0.85rem;
            font-style: italic;
            opacity: 0.9;
        }

        .message.error {
            background: rgba(247, 118, 142, 0.1);
            border-left: 3px solid var(--accent-red);
        }

        .message.custom {
            background: rgba(0, 188, 212, 0.08);
            border-left: 3px solid var(--accent-cyan);
            margin: 0 60px 16px 60px;
            font-size: 0.85rem;
        }

        .message-role {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .message-content {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .message.user .message-role {
            color: var(--text-secondary);
        }

        .message.assistant .message-role {
            color: var(--accent-blue);
        }

        .message.tool .message-role {
            color: var(--accent-orange);
        }

        .message.reasoning .message-role {
            color: var(--accent-green);
        }

        .message.custom .message-role {
            color: var(--accent-cyan);
        }

        .input-area {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        #input {
            flex: 1;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(122, 162, 247, 0.2);
        }

        #input::placeholder {
            color: var(--text-secondary);
        }

        #send-btn, #stop-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            color: white;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #send-btn {
            background: linear-gradient(135deg, var(--accent-blue), #5a8af7);
        }

        #send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(122, 162, 247, 0.3);
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #stop-btn {
            background: linear-gradient(135deg, var(--accent-red), #e05555);
        }

        #stop-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(247, 118, 142, 0.3);
        }

        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border-radius: 16px;
            margin-bottom: 12px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--accent-blue);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-8px);
            }
        }

        .approval-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .approval-actions .approve {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .approval-actions .reject {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>AgentScope AG-UI Demo</h1>
        <p>Chat with an AI agent via the AG-UI protocol</p>
    </header>

    <div class="status">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Ready</span>
    </div>

    <div id="messages"></div>

    <div class="input-area">
        <input type="text" id="input" placeholder="Type a message... (Press Enter to send)" autocomplete="off">
        <button id="send-btn">Send</button>
        <button id="stop-btn" style="display: none;">Stop</button>
    </div>
</div>

<script type="module">
    import {AguiClient} from '/js/agui-client.js'

    const client = new AguiClient('/agui/run/chat')
    const input = document.getElementById('input')
    const sendBtn = document.getElementById('send-btn')
    const stopBtn = document.getElementById('stop-btn')
    const messages = document.getElementById('messages')
    const statusDot = document.getElementById('status-dot')
    const statusText = document.getElementById('status-text')

    const frontendTools = [{
        name: 'request_approval',
        description: 'Ask the user to approve or reject an action before continuing. Always call this tool when the user asks for the approval demo.',
        parameters: {
            type: 'object',
            properties: {
                action: {
                    type: 'string',
                    description: 'The action that needs user approval.'
                },
                reason: {
                    type: 'string',
                    description: 'Why the action needs approval.'
                }
            },
            required: ['action']
        }
    }]

    let threadId = 'thread-' + Date.now()
    let messageHistory = []
    let isRunning = false
    let activeToolCalls = new Map()
    let pendingInterrupts = []
    let resolvedInterrupts = new Map()
    let currentAssistantDiv = null
    let currentReasoningDiv = null

    function setStatus(status, text) {
        statusDot.className = 'status-dot' + (status === 'error' ? ' disconnected' : '')
        statusText.textContent = text
    }

    function appendMessage(role, content, append = false) {
        if (append && role === 'assistant' && currentAssistantDiv) {
            const contentEl = currentAssistantDiv.querySelector('.message-content')
            contentEl.textContent += content
            messages.scrollTop = messages.scrollHeight
            return
        }

        if (append && role === 'reasoning' && currentReasoningDiv) {
            const contentEl = currentReasoningDiv.querySelector('.message-content')
            contentEl.textContent += content
            messages.scrollTop = messages.scrollHeight
            return
        }

        const div = document.createElement('div')
        div.className = `message ${role}`
        div.innerHTML = `
                <div class="message-role">${role}</div>
                <div class="message-content">${escapeHtml(content)}</div>
            `
        messages.appendChild(div)
        messages.scrollTop = messages.scrollHeight

        if (role === 'assistant') {
            currentAssistantDiv = div
        } else if (role === 'reasoning') {
            currentReasoningDiv = div
        }
    }

    function showTypingIndicator() {
        const div = document.createElement('div')
        div.id = 'typing'
        div.className = 'typing-indicator'
        div.innerHTML = '<span></span><span></span><span></span>'
        messages.appendChild(div)
        messages.scrollTop = messages.scrollHeight
    }

    function hideTypingIndicator() {
        const typing = document.getElementById('typing')
        if (typing) typing.remove()
    }

    function escapeHtml(text) {
        const div = document.createElement('div')
        div.textContent = text
        return div.innerHTML
    }

    function formatCustomEvent(event) {
        if (event.name === 'token_usage') {
            const delta = event.value?.delta || {}
            const cumulative = event.value?.cumulative || {}
            return [
                'Token usage',
                `delta: input=${delta.inputTokens ?? 0}, output=${delta.outputTokens ?? 0}, total=${delta.totalTokens ?? 0}`,
                `cumulative: input=${cumulative.inputTokens ?? 0}, output=${cumulative.outputTokens ?? 0}, total=${cumulative.totalTokens ?? 0}`
            ].join('\n')
        }

        return `${event.name}\n${JSON.stringify(event.value ?? {}, null, 2)}`
    }

    function interruptDisplayInfo(interrupt) {
        const meta = interrupt.metadata || {}
        const toolName = meta.toolName || interrupt.toolCallId || 'unknown'
        let args = null
        if (meta.toolInput && typeof meta.toolInput === 'object') {
            args = JSON.stringify(meta.toolInput, null, 2)
        } else if (meta.toolContent) {
            args = meta.toolContent
        }
        return {toolName, args, message: interrupt.message || ''}
    }

    function appendApprovalDialog(interrupt) {
        const info = interruptDisplayInfo(interrupt)
        const lines = [
            `interruptId: ${interrupt.id}`,
            `toolCallId: ${interrupt.toolCallId || '(none)'}`,
            `tool: ${info.toolName}`,
            info.message ? `message: ${info.message}` : null
        ].filter(Boolean)
        if (info.args) lines.push(`args:\n${info.args}`)

        const div = document.createElement('div')
        div.className = 'message tool'
        div.innerHTML = `
                <div class="message-role">approval required</div>
                <div class="message-content">${escapeHtml(lines.join('\n'))}</div>
                <div class="approval-actions">
                    <button class="approve" type="button">Approve</button>
                    <button class="reject" type="button">Reject</button>
                </div>
            `
        div.querySelector('.approve').addEventListener('click', () => resolveInterrupt(interrupt, true, div))
        div.querySelector('.reject').addEventListener('click', () => resolveInterrupt(interrupt, false, div))
        messages.appendChild(div)
        messages.scrollTop = messages.scrollHeight
    }

    function resolveInterrupt(interrupt, approved, dialog) {
        if (isRunning) return

        resolvedInterrupts.set(interrupt.id, {status: 'resolved', payload: {approved}})

        if (dialog) {
            dialog.querySelectorAll('button').forEach(button => button.disabled = true)
            const actions = dialog.querySelector('.approval-actions')
            if (actions) actions.remove()
        }
        appendMessage('tool', `${approved ? 'Approved' : 'Rejected'} ${interrupt.id}\n${JSON.stringify({approved})}`)

        if (resolvedInterrupts.size === pendingInterrupts.length) {
            submitResume()
        }
    }

    async function submitResume() {
        const resume = pendingInterrupts.map(interrupt => {
            const answer = resolvedInterrupts.get(interrupt.id)
            return {
                interruptId: interrupt.id,
                status: answer ? answer.status : 'cancelled',
                payload: answer ? answer.payload : undefined
            }
        })
        pendingInterrupts = []
        resolvedInterrupts.clear()
        await runAgent([], resume)
    }

    function handleRunFinished(event) {
        const interrupts = (event && event.outcome && event.outcome.type === 'interrupt')
            ? (event.outcome.interrupts || [])
            : []
        if (interrupts.length > 0) {
            pendingInterrupts = interrupts
            resolvedInterrupts.clear()
            for (const interrupt of interrupts) {
                appendApprovalDialog(interrupt)
            }
            setStatus('waiting', 'Awaiting approval')
            return
        }
        setStatus('ready', 'Ready')
    }

    async function runAgent(messagesForServer, resume = null) {
        isRunning = true
        sendBtn.style.display = 'none'
        stopBtn.style.display = 'inline-block'
        setStatus('running', 'Running...')
        showTypingIndicator()

        let assistantContent = ''
        let currentMessageId = null
        let reasoningContent = ''

        try {
            const runInput = {
                threadId: threadId,
                runId: 'run-' + Date.now(),
                messages: messagesForServer,
                tools: frontendTools
            }
            if (resume) {
                runInput.resume = resume
            }

            await client.run(runInput, {
                onRunStarted: () => {
                    currentAssistantDiv = null
                    currentReasoningDiv = null
                    reasoningContent = ''
                },
                onReasoningMessageStart: (messageId, role) => {
                    hideTypingIndicator()
                    reasoningContent = ''
                    currentReasoningDiv = null
                },
                onReasoningContent: (delta, messageId) => {
                    if (reasoningContent === '') {
                        appendMessage('reasoning', delta)
                    } else {
                        appendMessage('reasoning', delta, true)
                    }
                    reasoningContent += delta
                },
                onReasoningMessageEnd: (messageId) => {
                    currentReasoningDiv = null
                    reasoningContent = ''
                },
                onTextMessageStart: (messageId, role) => {
                    hideTypingIndicator()
                    currentMessageId = messageId
                    assistantContent = ''
                    currentAssistantDiv = null
                },
                onTextContent: (delta) => {
                    if (assistantContent === '') {
                        appendMessage('assistant', delta)
                    } else {
                        appendMessage('assistant', delta, true)
                    }
                    assistantContent += delta
                },
                onTextMessageEnd: (messageId) => {
                    if (assistantContent) {
                        messageHistory.push({
                            id: messageId,
                            role: 'assistant',
                            content: assistantContent
                        })
                    }
                    currentAssistantDiv = null
                },
                onToolCallStart: (toolCallId, toolName) => {
                    hideTypingIndicator()
                    currentAssistantDiv = null
                    activeToolCalls.set(toolCallId, {name: toolName, args: ''})
                    appendMessage('tool', `Calling tool: ${toolName}`)
                },
                onToolCallArgs: (toolCallId, delta) => {
                    const toolCall = activeToolCalls.get(toolCallId) || {name: 'unknown', args: ''}
                    toolCall.args += delta || ''
                    activeToolCalls.set(toolCallId, toolCall)
                },
                onToolCallEnd: (toolCallId) => {
                    const toolCall = activeToolCalls.get(toolCallId)
                    if (toolCall?.args) {
                        appendMessage('tool', `Tool arguments for ${toolCall.name}\n${toolCall.args}`)
                    }
                },
                onToolCallResult: (toolCallId, content) => {
                    hideTypingIndicator()
                    appendMessage('tool', `Tool result for ${toolCallId}\n${content || '(empty)'}`)
                },
                onError: (error) => {
                    hideTypingIndicator()
                    appendMessage('error', `Error: ${error}`)
                },
                onCustomEvent: (event) => {
                    hideTypingIndicator()
                    appendMessage('custom', formatCustomEvent(event))
                },
                onRunFinished: (threadId, runId, event) => {
                    hideTypingIndicator()
                    handleRunFinished(event)
                }
            })
        } catch (error) {
            console.error('Error during agent run:', error)
            hideTypingIndicator()

            if (error.name === 'AbortError') {
                console.log('Run was stopped by user')
                if (assistantContent) {
                    messageHistory.push({
                        id: currentMessageId || 'msg-stopped-' + Date.now(),
                        role: 'assistant',
                        content: assistantContent + ' [stopped]'
                    })
                }
                setStatus('ready', 'Stopped')
            } else {
                appendMessage('error', `Error: ${error.message}`)
                setStatus('error', 'Error')
            }
        } finally {
            isRunning = false
            sendBtn.style.display = 'inline-block'
            stopBtn.style.display = 'none'
            hideTypingIndicator()
            currentAssistantDiv = null
            currentReasoningDiv = null
            reasoningContent = ''
            if (statusText.textContent === 'Running...') {
                setStatus('ready', 'Ready')
            }
        }
    }

    async function sendMessage() {
        const text = input.value.trim()
        if (!text || isRunning) return

        input.value = ''
        appendMessage('user', text)
        const userMessage = {id: 'msg-' + Date.now(), role: 'user', content: text}
        messageHistory.push(userMessage)
        await runAgent(messageHistory)
    }

    function stopGeneration() {
        if (isRunning) {
            setStatus('stopping', 'Stopping...')
            client.abort()
        }
    }

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage()
    })
    sendBtn.addEventListener('click', sendMessage)
    stopBtn.addEventListener('click', stopGeneration)
    input.focus()
</script>
</body>
</html>
