<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>events bind usage</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div>事件修饰符：
        <form>
            <button @click.prevent="handlePreventedSubmitClick">提交</button>
            {{ submitClickCount }}
        </form>
    </div>
</div>
<script type="module">
    import {createApp, ref} from 'vue'

    createApp({
        setup() {
            const submitClickCount = ref(0)

            function handlePreventedSubmitClick() {
                submitClickCount.value++
            }

            return {handlePreventedSubmitClick, submitClickCount}
        },
        methods: {
            handleClick() {
                this.submitClickCount++
            }
        }
    }).mount('#app')
</script>
</body>
</html>
