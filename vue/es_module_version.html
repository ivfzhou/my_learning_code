<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>es module version</title>
    <!-- https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.prod.js -->
    <!-- https://unpkg.com/vue@3.5.32/dist/vue.runtime.esm-bundler.js -->
    <!-- https://unpkg.com/vue@3.5.32/dist/vue.runtime.esm-browser.prod.js -->
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
</div>
<script type="module">
    /* ES 模块不能通过 file:// 协议工作 */
    import {createApp} from 'vue'

    createApp({}).mount('#app')
</script>
</body>
</html>
