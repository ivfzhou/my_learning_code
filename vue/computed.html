<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>computed</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div>
        valueComputed：{{ valueComputed }}<br/>
        set value: <input @change="value = $event.target.value"/>
    </div>
    <hr/>

    <div>
        valueComputedCanSet：{{ valueComputedCanSet }}<br/>
        set valueComputedCanSet: <input @change="messageComputedCanSet = $event.target.value"/>
    </div>
</div>
<script type="module">
    import {createApp, ref, computed} from 'vue'

    createApp({
        setup() {
            const value = ref('')
            const valueComputed = computed((oldValue) => {
                console.log(oldValue)
                return value.value
            })
            const valueComputedCanSet = computed({
                get: (oldValue) => {
                    return value.value
                },
                set: (newValue) => {
                    value.value = newValue
                }
            })

            return {
                valueComputed,
                value,
                valueComputedCanSet
            }
        }
    }).mount('#app')
</script>
</body>
</html>
