<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>reactive</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div>{{ value11.id + 2 }}</div>
    <hr/>

    <div>
        value12: {{ value12 }}<br/>
        <button @click="changeList">change list</button>
    </div>
    <hr/>

    <div>
        value13: {{ value13 }}<br/>
        <button @click="changeMap">change map</button>
    </div>
</div>
<script type="module">
    import {createApp, reactive, shallowReactive, ref} from 'vue'

    createApp({
        setup() {
            const value = ref(0)
            const value2 = ref(value)
            console.log(value === value2) // true

            const value3 = reactive({})
            const value4 = reactive(value3)
            console.log(value3 === value4) // true

            const obj = {id: {}}
            const value5 = ref(obj)
            const value6 = ref(obj.id)
            // value5.value.id 自动解包
            console.log(value5.value.id === value6.value) // true
            console.log(value5.value.id === obj.id) // false

            const obj2 = {id: 1, name: 'zs'}
            const value7 = ref(obj2)
            const {id, name} = value7.value
            console.log(id, name)

            const obj3 = {id: {}}
            const value9 = reactive(obj3)
            const value10 = reactive(obj3.id)
            console.log(value9.id === value10) // true
            console.log(value9.id === obj3.id) // false
            console.log(value10 === obj3.id) // false

            const value11 = ref({id: 1})

            const list = [{id: 1}]
            const value12 = ref(list)
            console.log(value12.value[0].id)
            const changeList = () => {
                list[0].id = 2
                console.log(list[0].id)
            }

            const map = new Map([['id', 1]])
            const value13 = ref(map)
            console.log(value13.value.get('id'))
            const changeMap = () => {
                map.set('id', 2)
                console.log(map.get('id'))
            }

            return {value11, value12, value13, changeList, changeMap}
        }
    }).mount('#app')
</script>
</body>
</html>
