<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>if</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div>
        status1: {{ status1 }}
        <button @click="status1 = !status1">change</button>
        <br/>
        status2: {{ status2 }}
        <button @click="status2 = !status2">change</button>
    </div>
    <div>
        <span v-if="status1">status1 showed</span>
        <span v-else-if="status2">status2 showed</span>
        <span v-else>no status showed</span>
    </div>
    <hr/>
    <div>
        <div>
            templateIfStatus: {{ templateIfStatus }}
            <button @click="templateIfStatus = !templateIfStatus">change</button>
        </div>
        <div>
            <template v-if="templateIfStatus">
                <span>templateIfStatus showed</span>
            </template>
        </div>
    </div>
    <hr/>
    <div>
        showStatus: {{ showStatus }}
        <button @click="showStatus = !showStatus">change</button>
        <button @click="printShowSpanStyle">print display value</button>
    </div>
    <div>
        <span id="showSpan" v-show="showStatus">showStatus showed</span>
    </div>
</div>
<script type="module">
    import {createApp, ref} from 'vue'

    createApp({
        setup() {
            const status1 = ref(true)
            const status2 = ref(true)
            const templateIfStatus = ref(true)
            const showStatus = ref(true)
            const printShowSpanStyle = () => console.log(window.document.getElementById('showSpan').style.display)

            return {status1, status2, templateIfStatus, showStatus, printShowSpanStyle}
        }
    }).mount('#app')
</script>
</body>
</html>
