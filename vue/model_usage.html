<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>mode usage</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div>
        {{ value }}
        <br/>
        <textarea v-model.lazy="value"></textarea>
    </div>

    <div>
        {{ toggle }}
        <br/>
        <input type="checkbox" v-model="toggle" :true-value="'yes'" :false-value="'no'"/>
    </div>
</div>
<script type="module">
    import {createApp, ref} from 'vue'

    createApp({
        setup() {
            const value = ref('')
            const toggle = ref(false)
            return {
                value,
                toggle
            }
        }
    }).mount('#app')
</script>
</body>
</html>
