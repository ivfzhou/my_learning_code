<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>component props</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app"></div>
<template id="parent">
    <div>
        <child :message="message"></child>
        <input type="text" v-model="message">
    </div>
</template>
<template id="child">
    <div>{{message}}</div>
</template>
<script type="module">
    import {createApp, ref} from 'vue'

    const Child = {
        // props: ['message'],
        props: {
            message: {
                type: [String, null],
                required: true,
                default: 'default',
                validator: (value, props) => {
                    return true
                }
            },
            obj: {
                type: Object,
                default(rawProp) {

                }
            },
            fn: {
                type: Function,
                default() {

                }
            }
        },
        setup(props) {
        },
        template: '#child',
    }
    const Parent = {
        setup() {
            const message = ref('')
            return {message}
        },
        template: '#parent',
        components: {Child}
    }

    createApp(Parent).mount('#app')
</script>
</body>
</html>
