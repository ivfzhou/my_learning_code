<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>component emits</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app"></div>
<template id="parent">
    <div>
        <child @fn="fn"></child>
    </div>
</template>
<template id="child">
    <div>
        <button @click="$emit('fn', {param: 1})">按钮</button>
    </div>
</template>
<script type="module">
    import {createApp, ref} from 'vue'

    const Child = {
        // emit: ['fn'],
        emit: {
            fn: ({param}) => {
                console.log('param', param)
                return false
            }
        },
        setup(props, ctx) {
        },
        template: '#child',
    }
    const Parent = {
        setup() {
        },
        methods: {
            fn(n) {
                console.log('fn', n)
            }
        },
        template: '#parent',
        components: {Child}
    }

    createApp(Parent).mount('#app')
</script>
</body>
</html>
