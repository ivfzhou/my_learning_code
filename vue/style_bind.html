<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>style bind usage</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div>
        style：{{ obj }}<span style="color: red;" :style="obj"></span>
    </div>

    <div>
        style：{{ arr }}<span :style="arr"></span>
    </div>

    <div>
        style: {{ obj2 }}<span :style="obj2"></span>
    </div>
</div>
<script type="module">
    import {createApp, ref} from 'vue'

    createApp({
        setup() {
            const obj = ref({
                color: 'blue',
                fontSize: '12px',
                'text-align': 'center'
            })
            const arr = ref([{'color': 'blue', 'fontSize': '12px'}, {'textAlign': 'left', 'fontSize': '14px'}])
            const obj2 = ref({display: ['-webkit-box', '-ms-flexbox', 'flex']})
            return {
                obj,
                arr,
                obj2
            }
        }
    }).mount('#app')
</script>
</body>
</html>
