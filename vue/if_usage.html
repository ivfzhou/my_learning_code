<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>if usage</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div>
        if：{{ f }}
        <span v-if="f">展示</span>
        <span v-else-if="true">展示</span>
        <span v-else>不展示</span>
    </div>

    <div>
        <template v-if="f">
            <span>展示</span>
        </template>
    </div>

    <div>
        <span v-show="!f">展示</span>
    </div>
</div>
<script type="module">
    import {createApp, ref} from 'vue'

    createApp({
        setup() {
            const f = ref(true)
            return {
                f
            }
        }
    }).mount('#app')
</script>
</body>
</html>
