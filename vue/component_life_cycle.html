<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>component life cycle</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <button @click="click">点击</button>
    <br/>
    <input type="text" v-model="message"/>
    <component v-if="show" :message="message"></component>
</div>
<script type="module">
    import {createApp, ref} from 'vue'

    const Component = {
        props: ['message'],
        template: `<div>{{ message }}</div>`,
        beforeCreate() {
            console.log('beforeCreate')
        },
        created() {
            console.log('created')
        },
        beforeMount() {
            console.log('beforeMount')
        },
        mounted() {
            console.log('mounted')
        },
        beforeUpdate() {
            console.log('beforeUpdate')
        },
        updated() {
            console.log('updated')
        },
        beforeUnmount() {
            console.log('beforeUnmount')
        },
        unmounted() {
            console.log('unmounted')
        }
    }
    createApp({
        setup() {
            const show = ref(false)
            const message = ref('')
            return {show, message}
        },
        methods: {
            click() {
                this.show = !this.show
            }
        },
        components: {Component}
    }).mount('#app')
</script>
</body>
</html>
