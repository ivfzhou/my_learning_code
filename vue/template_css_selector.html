<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>template css selector</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<template id="componentA">
    <div>ComponentA</div>
</template>
<template id="componentB">
    <div>ComponentB</div>
</template>
<div id="app"></div>
<script type="module">
    import {createApp} from 'vue'

    const componentA = {
        template: '#componentA'
    }
    const componentB = {
        template: '#componentB'
    }
    const App = {
        setup() {

        },
        components: {ComponentA: componentA, ComponentB: componentB},
        template: `
<component-a></component-a>
<component-b></component-b>
`
    }

    createApp(App).mount('#app')
</script>
</body>
</html>
