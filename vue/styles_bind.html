<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>style bind usage</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div>
        obj: {{ obj }}<br/>
        set obj.color: <input @change="obj.color = $event.target.value"/><br/>
        set obj.fontSize: <input @change="obj.fontSize = $event.target.value"/><br/>
        <div style="color: green; text-decoration-line: underline" :style="obj">element</div>
    </div>
    <hr/>

    <div>
        arr: {{ arr }}<br/>
        set arr[0].color: <input @change="arr[0].color = $event.target.value"/><br/>
        set arr[1].fontSize: <input @change="arr[1].fontSize = $event.target.value"/><br/>
        <div style="color: green; text-decoration-line: underline" :style="arr">element</div>
    </div>
    <hr/>

    <div>
        <!-- 会渲染浏览器支持的最后一个值 -->
        <div :style="{display: ['-webkit-box', '-ms-flexbox', 'flex']}">element</div>
    </div>
</div>
<script type="module">
    import {createApp, ref} from 'vue'

    createApp({
        setup() {
            const obj = ref({
                color: 'red',
                fontSize: '12px'
            })
            const arr = ref([{color: 'red'}, {fontSize: '12px'}])
            return {obj, arr}
        }
    }).mount('#app')
</script>
</body>
</html>
