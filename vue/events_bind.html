<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>events bind</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div>
        fn: {{ fn }}
        <br/>
        <button @click="fn = null">set to null</button>
        <br/>
        <div v-on:click="fn">v-on:click="fn"</div>
        <div @click="fn">@click="fn"</div>
    </div>
    <hr/>
    <div>
        eventname: {{ eventname }}
        <br/>
        <input @change="eventname = $event.target.value"/>
        <br/>
        <button @click="eventname = null">set to null</button>
        <div @[eventname]="fn">@[eventname]="fn"</div>
        <div v-on:[eventname]="fn">v-on:[eventname]="fn"</div>
    </div>
    <hr/>
    <div>
        <div @click="console.log('parent clicked')">
            parent
            <div @click="console.log('child clicked')">
                child
            </div>
            <!-- .stop 修饰符调用 event.stopPropagation() -->
            <div @click.stop="console.log('child clicked')">
                child has stop
            </div>
        </div>
    </div>
    <hr/>
    <div>
        <a href="./events_bind" @click="console.log($event.target)">a element</a>
        <br/>
        <a href="./events_bind" @click.prevent="console.log($event.target)">a element has prevent</a>
    </div>
</div>
<script type="module">
    import {createApp, ref} from 'vue'

    createApp({
        setup() {
            const fn = (event) => {
                console.log(event.target)
            }
            const eventName = ref('click')

            return {fn, eventname: eventName}
        }
    }).mount('#app')
</script>
</body>
</html>
