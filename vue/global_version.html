<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>global version usage</title>
    <script src="https://unpkg.com/vue@3.5.32/dist/vue.global.js"></script>
    <!-- <script src="https://unpkg.com/vue@3.5.32/dist/vue.global.prod.js"></script> -->
</head>
<body>
<div id="app">
    <span>{{ demoDescription }}</span>
</div>
<script>
    const {createApp, ref} = Vue
    createApp({
        setup() {
            const demoDescription = ref('this is a global vue usage.')
            return {
                demoDescription,
            }
        }
    }).mount('#app')
</script>
</body>
</html>
