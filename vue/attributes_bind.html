<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>attributes bind</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div>
        value: {{ value }}
        <br/>
        <input @change="value = $event.target.value"/>
        <br/>
        <button @click="value = null">set to null</button>
        <br/>
        <div v-bind:id="value">v-bind:id="value"</div>
        <div :id="value">:id="value"</div>
        <div :value>:value</div>
        <div v-bind:value>v-bind:value</div>
        <div v-bind:disabled="value">v-bind:disabled="value"</div>
    </div>
    <hr/>
    <div>
        obj: {{ obj }}
        <br/>
        <button @click="Object.defineProperty(obj, 'age', {value: 18}); console.log(obj.age)">addProperty</button>
        <br/>
        <div v-bind="obj">v-bind="obj"</div>
    </div>
    <hr/>
    <div>
        attributename: {{ attributename }}
        <br/>
        <input @change="attributename = $event.target.value"/>
        <br/>
        <button @click="attributename = null">set to null</button>
        <div :[attributename]="value">:[attributename]="value"</div>
        <div v-bind:[attributename]="value">v-bind:[attributename]="value"</div>
    </div>
</div>
<script type="module">
    import {createApp, ref} from 'vue'

    createApp({
        setup() {
            const value = ref('')
            const obj = ref({
                id: 1,
                name: 'zs'
            })
            const attributeName = ref('id')
            return {value, obj, attributename: attributeName}
        }
    }).mount('#app')
</script>
</body>
</html>
