<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>mustache usage</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div>文本插值：{{ plainTextMessage }}</div>

    <div>HTML 插值：<span v-html="rawHtmlContent"></span></div>

    <div>
        <button @click="incrementExpressionNumber">自增</button>
        表达式：{{ expressionNumber }}
    </div>

    <div>函数：{{ getPlainTextMessage() }}</div>
</div>
<script type="module">
    import {createApp, ref} from 'vue'

    createApp({
        setup() {
            const plainTextMessage = ref('hello mustache.')
            const rawHtmlContent = ref(`<span style="color: red;">hello mustache.</span>`)
            const expressionNumber = ref(1)
            return {
                plainTextMessage,
                rawHtmlContent,
                expressionNumber
            }
        },
        methods: {
            incrementExpressionNumber() {
                this.expressionNumber++
            },
            getPlainTextMessage() {
                return this.plainTextMessage
            }
        }
    }).mount('#app')
</script>
</body>
</html>
