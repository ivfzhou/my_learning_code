<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>mustache</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div>
        value：{{ fn(value) }}<br/>
        set value: <input @change="value = $event.target.value"/>
    </div>
</div>
<script type="module">
    import {createApp, ref} from 'vue'

    const app = createApp({
        setup() {
            const value = ref('')
            return {value}
        }
    })
    app.config.globalProperties.fn = (value) => value + '_changed'
    app.mount('#app')
</script>
</body>
</html>
