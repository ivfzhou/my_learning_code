<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>es module version</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <span>{{message}}</span>
</div>
<script type="module">
    /* ES 模块不能通过 file:// 协议工作 */
    import {createApp, ref} from 'vue'

    createApp({
        setup() {
            const message = ref('this is es module version usage.')
            return {
                message
            }
        }
    }).mount('#app')
</script>
</body>
</html>
