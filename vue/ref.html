<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>ref usage</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div>
        数字：{{ counterValue }}
        <button @click="incrementCounter">自增</button>
    </div>

    <div>
        字符串：{{ inputText }}
        <button @click="inputText = 'abc'">设置</button>
    </div>

    <div>
        数组：{{ itemList }}
        <button @click="itemList[0] = 'abc'">修改</button>
    </div>

    <div>
        映射：{{ scoreMapRef.get(1) }}
        <button @click="scoreMapRef.set(1, 3)">修改</button>
    </div>

    <div>
        对象：{{ userProfile.name }}
        <button @click="userProfile.name = 'abc'">修改</button>
    </div>

    <div>
        浅层引用对象：{{ shallowUserProfile.name }}
        <button @click="shallowUserProfile.name = 'abc'">修改</button>
        <button @click="shallowUserProfile = {name: 'abc'}">修改</button>
    </div>

    <div>
        内部属性解包：{{ nestedRefMap.get(1).value + 1 }}
    </div>
</div>
<script type="module">
    import {createApp, ref, shallowRef} from 'vue'

    createApp({
        setup() {
            const counterValue = ref(0)
            const inputText = ref('')
            const itemList = ref([''])
            const scoreMap = new Map()
            scoreMap.set(1, 2)
            const scoreMapRef = ref(scoreMap)
            const userProfile = ref({
                name: 'zs'
            })
            const shallowUserProfile = shallowRef({
                name: 'zs'
            })

            const numericWrapper = ref({count: 2})
            let {count: detachedCount} = numericWrapper.value
            detachedCount++
            console.log(numericWrapper.count, numericWrapper.value.count, detachedCount)

            const nestedNumberState = ref({num: 1})
            const nestedNumberRef = ref(2)
            nestedNumberState.value.num = nestedNumberRef
            console.log(nestedNumberState.value.num)
            nestedNumberRef.value++
            console.log(nestedNumberState.value.num)

            const nestedRefMap = ref(new Map([[1, ref(2)]]))
            console.log(nestedRefMap.value.get(1).value)

            return {
                counterValue,
                inputText,
                itemList,
                scoreMapRef,
                userProfile,
                shallowUserProfile,
                nestedRefMap
            }
        },
        methods: {
            incrementCounter() {
                this.counterValue++
            }
        }
    }).mount('#app')
</script>
</body>
</html>
