<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>class bind usage</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div>
        class：{{ obj }}<span class="a" :class="obj"></span>
    </div>

    <div>
        class：{{ arr }}<span class="a" :class="arr"></span>
    </div>

    <div>
        class：{{ arr2 }}<span class="a" :class="arr2"></span>
    </div>
</div>
<script type="module">
    import {createApp, ref} from 'vue'

    createApp({
        setup() {
            const obj = ref({
                b: true,
                c: false
            })
            let d = true
            const arr = ref(['b', 'c', d ? 'd' : ''])
            const arr2 = ref([{['b']: d}, 'd'])
            return {
                obj,
                arr,
                arr2
            }
        }
    }).mount('#app')
</script>
</body>
</html>
