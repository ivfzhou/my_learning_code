<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>element ref</title>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3.5.32/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>
<body>
<div id="app">
    <div>
        <div ref="div">element</div>
    </div>
    <hr/>

    <div>
        <div ref="list" v-for="v in 3">{{ v }}</div>
    </div>
    <hr/>

    <div>
        <div :ref="fn" :key="value">func ref element</div>
        set value: <input @change="value = $event.target.value"/>
    </div>
</div>
<script type="module">
    import {
        createApp,
        onMounted,
        ref,
        useTemplateRef,
    } from 'vue'

    createApp({
        setup() {
            const el = useTemplateRef('div')
            const els = useTemplateRef('list')
            const fn = (el) => {
                console.log(`fn: ${el && el.innerHTML}`)
            }
            const value = ref('')

            onMounted(() => {
                console.log(`el: ${el.value.innerHTML}`)
                console.log(`els: ${els.value[0].innerHTML}`)
            })

            return {fn, value}
        }
    }).mount('#app')
</script>
</body>
</html>
